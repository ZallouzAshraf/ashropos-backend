services:
  postgres:
    image: postgres:16-alpine
    container_name: ashropos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ashropos
      POSTGRES_PASSWORD: ashropos
      POSTGRES_DB: ashropos
    ports:
      - "5433:5432"
    volumes:
      - ashropos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashropos -d ashropos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ashropos_pgdata:
